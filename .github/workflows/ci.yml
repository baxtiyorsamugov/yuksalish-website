name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile scripts/prepare_legacy_preview.py

      - name: Check PHP syntax
        run: |
          docker run --rm -v "$PWD/app:/app:ro" php:8.4-cli \
            sh -ec 'find /app -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l'

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example -f compose.yaml config -q
          docker compose --env-file .env.example -f compose.yaml -f compose.legacy.yaml config -q

      - name: Start site and test database connection
        run: |
          docker compose --env-file .env.example up -d --build web
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:8088/ | grep -q 'Yuksalish'
          docker compose --env-file .env.example exec -T web php -r \
            '$pdo = new PDO("mysql:host=" . getenv("DB_HOST") . ";dbname=" . getenv("DB_NAME"), getenv("DB_USER"), getenv("DB_PASSWORD")); if ($pdo->query("SELECT 1")->fetchColumn() != 1) { exit(1); }'

      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.example down -v
